<section class="hp-review">
  <div class="shell">
    <div class="hp-review__row">
      <div class="hp-review__media">
        <img class="hp-review__portrait" src="assets/icon/av-review.png" alt="">
        <span class="hp-review__play">
          <img src="assets/icon/hp-review-play.svg" alt="" aria-hidden="true">
        </span>
      </div>
      <figure class="hp-review__body">
        <blockquote class="hp-review__quote">
          <img class="hp-review__mark" src="assets/icon/hp-review-quotes.svg" alt="" aria-hidden="true">
          <p class="h4 hp-review__text">The freedom, flexibility, and support keep us with BuddyBoss for the long haul. It’s helping us turn our vision of building the Internet of Apps into reality.</p>
        </blockquote>
        <figcaption class="hp-review__by">
          <span class="review__name">John Doe</span>
          <span class="review__role">Managing Director</span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
